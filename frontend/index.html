<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#view" data-text="nav.skip"></a>

  <div class="app">
    <header class="topbar">
      <button type="button" id="menu-toggle" class="icon-btn icon-btn-light" aria-controls="sidebar" aria-expanded="false" data-aria-label="nav.openMenu">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <span class="topbar-title" data-text="app.name"></span>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-ribbon" aria-hidden="true"></span>
        <span class="brand-name" data-text="app.name"></span>
      </div>
      <nav aria-labelledby="nav-label">
        <span id="nav-label" class="visually-hidden" data-text="nav.main"></span>
        <a href="#dashboard" data-route="dashboard">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6V11h-6zM14 8h6V4h-6zM4 20h6v-4H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span data-text="nav.dashboard"></span>
        </a>
        <a href="#books" data-route="books">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span data-text="nav.books"></span>
        </a>
        <a href="#authors" data-route="authors">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span data-text="nav.authors"></span>
        </a>
        <a href="#reading-log" data-route="reading-log">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span data-text="nav.readingLog"></span>
        </a>
        <a href="#settings" data-route="settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span data-text="nav.settings"></span>
        </a>
      </nav>
      <p class="sidebar-note" data-text="app.sidebarNote"></p>
    </aside>

    <div class="scrim" id="scrim" hidden></div>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <dialog id="form-dialog" class="dialog dialog-wide"></dialog>
  <dialog id="confirm-dialog" class="dialog dialog-small"></dialog>
  <div id="toast-host" class="toast-host"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
